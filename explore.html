<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore – Tenzin Choden Thinley</title>
    <link rel="stylesheet" href="./static/css/styles.css" />

    <style>
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem;
      }

      .game-embed {
        position: relative;
        display: grid;
        gap: 0.75rem;
      }

      /* Responsive 16:9 embed */
      #solo-sprint-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 0;
        background: #000; /* prevents white flash while loading */
      }

      .game-actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .game-btn {
        padding: 0.6rem 0.9rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
        cursor: pointer;
        background: #f7f7f7;
      }

      .game-btn:hover {
        filter: brightness(0.95);
      }
    </style>
  </head>

  <body>
    <!-- ========== MAIN SECTION ========== -->
    <section id="playground" class="container">
      <h2>Play: Solo Sprint 2D</h2>

      <div class="game-embed">
        <iframe
          id="solo-sprint-frame"
          src="game/2D/index.html"
          loading="lazy"
          allow="fullscreen; gamepad"
          allowfullscreen
          referrerpolicy="no-referrer"
        ></iframe>

        <div class="game-actions">
          <button id="game-fullscreen" class="game-btn">Fullscreen</button>
          <a
            class="game-btn"
            href="game/2D/index.html"
            target="_blank"
            rel="noopener"
            >Open in new tab</a
          >
        </div>
      </div>

      <noscript>
        Your browser has JavaScript disabled. You can open the game
        <a href="game/2D/index.html" target="_blank" rel="noopener"
          >in a new tab</a
        >.
      </noscript>
    </section>

    <script>
      (function () {
        const frame = document.getElementById("solo-sprint-frame");
        document
          .getElementById("game-fullscreen")
          ?.addEventListener("click", () => {
            if (frame.requestFullscreen) frame.requestFullscreen();
            else if (frame.webkitRequestFullscreen)
              frame.webkitRequestFullscreen();
            else alert("Fullscreen not supported in this browser.");
          });
      })();
    </script>
  </body>
</html>
